box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
html{overflow-anchor:none}html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:radial-gradient(120% 60% at 50% 0%,#3b2a73 0%,var(--bg) 60%);background-color:var(--bg);color:#fff;font-family:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',sans-serif;min-height:100vh}
#app{max-width:1040px;margin:0 auto;padding:22px 18px 40px}
.narrow{max-width:520px;margin:0 auto}
.split{display:block}
h1{font-size:44px;line-height:1;margin:6px 0 4px;font-weight:800;letter-spacing:-1.5px}
h2{font-size:15px;margin:26px 0 10px;color:var(--mut);font-weight:700;display:flex;justify-content:space-between;align-items:center}
h2 span button{background:var(--bg2);border:1.5px solid var(--line);color:#fff;border-radius:20px;padding:5px 12px;font-weight:700;font-size:13px;font-family:inherit;margin-left:6px}
p.sub{margin:0;color:var(--mut);font-size:15px}
.row{display:flex;align-items:center;justify-content:space-between;background:var(--bg2);border:1.5px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:10px}
.row b{font-size:17px}.row small{display:block;color:var(--mut);font-weight:500;font-size:12px}
.step{display:flex;align-items:center;gap:14px}
.step button{width:42px;height:42px;border-radius:50%;border:0;background:var(--acc);color:#fff;font-size:24px;font-weight:800;font-family:inherit}
.step span{min-width:74px;text-align:center;font-size:22px;font-weight:800}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cat{padding:12px 10px;border-radius:18px;border:2px solid var(--line);background:var(--bg2);color:#fff;font-weight:700;font-size:16px;font-family:inherit;text-align:left;display:flex;flex-direction:column;gap:4px;transition:transform .12s}
.cat:active{transform:scale(.96)}
.cat i{font-style:normal;font-size:26px}
.cat.on{background:var(--card);color:var(--ink);border-color:var(--c);box-shadow:0 0 0 2px var(--c)}
.tog{width:52px;height:30px;border-radius:30px;background:var(--line);border:0;position:relative;flex:none}
.tog:after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}
.tog.on{background:var(--ok)}.tog.on:after{left:25px}
.big{display:block;width:100%;border:0;border-radius:calc(var(--r,28px)*.7);padding:18px;font-weight:800;font-size:20px;font-family:inherit;background:var(--acc);color:#fff;margin-top:18px;box-shadow:0 6px 0 rgba(0,0,0,.35)}
.big:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.35)}
.big.alt{background:var(--card);color:var(--ink);box-shadow:0 6px 0 #a79cc9}
.big.alt:active{box-shadow:0 2px 0 #a79cc9}
.center{min-height:calc(100vh - 130px);min-height:calc(100dvh - 130px);display:flex;flex-direction:column;justify-content:center;text-align:center}
.who{font-size:20px;color:var(--mut);font-weight:700}
.name{font-size:clamp(36px,13vw,64px);font-weight:800;letter-spacing:-2px;margin:6px 0 24px}
.card{background:var(--card);color:var(--ink);border-radius:var(--r,28px);padding:34px 20px;margin:10px 0}
.card .k{font-size:15px;font-weight:700;color:#6b5d94}
.card .w{font-size:clamp(28px,10vw,48px);font-weight:800;letter-spacing:-1px;margin:8px 0;word-break:break-word}
.card.imp{background:var(--acc);color:#fff}
.card.imp .k{color:#ffe1d4}
.hint{margin-top:14px;background:rgba(0,0,0,.2);border-radius:14px;padding:12px;font-size:19px;font-weight:700;line-height:1.25}
.chip{display:inline-block;background:var(--acc);border-radius:30px;padding:8px 16px;margin:4px;font-weight:800;font-size:20px}
.tm{font-size:clamp(44px,15vw,72px);font-weight:800;letter-spacing:-2px;margin:0 0 6px;font-variant-numeric:tabular-nums}
.tm.end{color:var(--acc)}
.err{color:#ffb199;font-size:14px;margin-top:10px;min-height:18px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
#deco{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
#deco span{position:absolute;opacity:.14;animation:dr 9s ease-in-out infinite alternate}
@keyframes dr{to{translate:0 14px}}
#app{position:relative;z-index:1}

@media(prefers-reduced-motion:reduce){#deco span{animation:none}}

.rc{font-size:60px;font-weight:800;letter-spacing:10px;text-align:center;background:var(--bg2);border:2px dashed var(--line);border-radius:20px;padding:10px 0 10px 10px;margin:6px 0 10px}
.mini{flex:1;background:var(--bg2);border:1.5px solid var(--line);color:#fff;border-radius:14px;padding:10px;font-weight:700;font-size:15px;font-family:inherit}
.chip.me{outline:2px solid #fff}.warn{background:#4a2a1a;border:1.5px solid var(--acc);border-radius:14px;padding:10px 12px;font-size:14px;margin:14px 0}
.hm{min-height:calc(100vh - 60px);min-height:calc(100dvh - 60px);display:flex;flex-direction:column;justify-content:center}
.logo{width:112px;height:112px;margin:0 auto 18px;border-radius:34px;background:linear-gradient(145deg,#ff8a3d,#ff4d6d);display:grid;place-items:center;font-size:64px;box-shadow:0 16px 44px rgba(255,90,70,.45);transform:rotate(-6deg)}
.ttl{font-size:clamp(46px,16vw,72px);font-weight:800;letter-spacing:-2px;line-height:.95;margin:0;text-align:center}.ttl em{font-style:normal;color:var(--acc)}
.tag{text-align:center;color:var(--mut);font-size:17px;margin:10px 0 22px}
.mode{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--bg2);border:2px solid var(--line);border-radius:26px;padding:16px;color:#fff;font-family:inherit;margin-top:14px;box-shadow:0 6px 0 rgba(0,0,0,.3)}
.mode:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.3)}
.mode i{font-style:normal;font-size:36px;width:66px;height:66px;border-radius:20px;display:grid;place-items:center;background:var(--acc);flex:none}
.mode.b i{background:var(--ok)}.mode b{display:block;font-size:22px;margin-bottom:2px}.mode span{color:var(--mut);font-size:14px;font-weight:500;line-height:1.3}
.how{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:26px;text-align:center}
.how div{background:rgba(255,255,255,.06);border-radius:16px;padding:12px 6px;font-size:13px;color:var(--mut);font-weight:700}.how i{display:block;font-style:normal;font-size:26px;margin-bottom:4px}

.cnt{font-style:normal;color:var(--mut);font-size:13px;margin-right:4px}
.go{max-width:520px;margin-left:auto;margin-right:auto}

button{cursor:pointer}
@media(min-width:560px) and (max-width:859px){.cats{grid-template-columns:repeat(3,1fr)}}
@media(min-width:860px){
#app{padding:40px 28px 56px}
.split{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:40px;align-items:start}
.cats{grid-template-columns:repeat(3,1fr)}
.split h2:first-child{margin-top:8px}
.cat{padding:14px 12px}
h1{font-size:56px}
.card{padding:46px 28px}

@media(hover:hover){
.cat:hover{transform:translateY(-2px);border-color:var(--c)}
.big:hover,.mode:hover,.mini:hover,.back:hover,.step button:hover{filter:brightness(1.12)}
}
@media(max-height:520px) and (orientation:landscape){.center,.hm{min-height:auto;padding:12px 0}.logo{width:72px;height:72px;font-size:40px;margin-bottom:8px}}

function catBox(){var c=Object.keys(S.cats).length;return '<h2>Kategoriler <span><em class="cnt">'+c+'/'+K.length+'</em><button onclick="selAll(1)">Hepsi</button><button onclick="selAll(0)">Temizle</button></span></h2><div class="cats">'+catGrid()+'</div><div class="err">'+S.err+'</div>'}
function setup(keep){S.mode='local';theme();KEEP=keep?1:0;
$(B('home()')+'<h1>Sahtekâr</h1><p class="sub">Telefon elden ele dolaşır. Biri hariç herkes kelimeyi bilir.</p>'+
'<div class="split"><div><h2>Oyun</h2>'+st('Oyuncu sayısı','n','')+st('Sahtekâr sayısı','imp','')+st('Tartışma süresi','min','dk')+
tg('Sahtekâra ipucu ver','Kategori ve esrarengiz bir ipucu görür','hint')+tg('Sürpriz tur','Bazen hiç sahtekâr olmaz','surp')+'</div>'+
'<div>'+catBox()+'</div></div><button class="big go" onclick="go()">Oyunu başlat</button>',1)}
function st(t,k,u){return '<div class="row"><b>'+t+'</b><div class="step"><button onclick="ch(\''+k+'\',-1)">−</button><span>'+(k=='min'&&!S.min?'Kapalı':S[k]+(u?' '+u:''))+'</span><button onclick="ch(\''+k+'\',1)">+</button></div></div>'}
function tg(t,s,k){return '<div class="row"><b>'+t+'<small>'+s+'</small></b><button class="tog'+(S[k]?' on':'')+'" onclick="S.'+k+'=!S.'+k+';rr()" aria-label="'+t+'"></button></div>'}
function ch(k,d){var v=S[k]+d;
if(k=='n')v=Math.max(3,Math.min(15,v));else if(k=='min')v=Math.max(0,Math.min(15,v));else v=Math.max(1,Math.min(v,4));
S[k]=v;var N=S.mode=='online'?O.players.length:S.n,m=Math.max(1,Math.floor((N-1)/2));if(S.imp>m)S.imp=m;rr()}
function tc(k){if(S.cats[k])delete S.cats[k];else S.cats[k]=1;S.err='';rr()}
function selAll(f){S.err="";S.cats={};if(f)K.forEach(function(k){S.cats[k]=1});rr()}
function go(){
var ks=Object.keys(S.cats);
if(!ks.length){S.err='En az bir kategori seç.';return setup(1)}
var pool=[];ks.forEach(function(k){D[k][1].split('/').forEach(function(e){pool.push([k,e.split('|')])})});
var fresh=pool.filter(function(p){return !S.used[p[1][0]]});
if(!fresh.length){S.used={};fresh=pool}
var p=fresh[Math.floor(Math.random()*fresh.length)];
S.cat=p[0];S.word=[p[1][0],hintFor(p[0],p[1][0])];theme(S.cat);S.used[p[1][0]]=1;
var idx=[];for(var i=0;i<S.n;i++)idx.push(i);
idx.sort(function(){return Math.random()-.5});
S.roles=(S.surp&&Math.random()<.2)?[]:idx.slice(0,S.imp);
S.i=0;T=0;S.start=Math.floor(Math.random()*S.n);pass()}
function pass(){
$(B('bk()')+'<div class="center"><div style="font-size:64px;line-height:1.1">'+D[S.cat][0]+'</div><div class="who">Telefonu ver</div><div class="name">Oyuncu '+(S.i+1)+'</div><p class="sub">Sadece sen bak. Hazır olunca kartı aç.</p><button class="big" onclick="show()">Kartımı göster</button></div>')}
function show(){
buz();var imp=S.roles.indexOf(S.i)>-1,last=S.i==S.n-1,h;
if(imp)h='<div class="card imp"><div class="k">Senin rolün</div><div class="w">SAHTEKÂR</div><div class="k">Kategori: '+S.cat+'</div>'+(S.hint?'<div class="hint">“'+S.word[1]+'”</div>':'')+'</div><p class="sub">Kelimeyi bilmiyorsun. Fark ettirme.</p>';
else h='<div class="card"><div class="k">Kategori: '+S.cat+'</div><div class="w">'+S.word[0]+'</div><div class="k">'+TH[S.cat][4]+'</div></div><p class="sub">Sahtekâra belli etmeden anlat.</p>';
$(B('bk()')+'<div class="center"><div class="who">Oyuncu '+(S.i+1)+'</div>'+h+'<button class="big alt" onclick="nx()">'+(last?'Gizle ve oyuna geç':'Gizle, sıradaki')+'</button></div>')}
function nx(){S.i++;if(S.i>=S.n)play();else pass()}
var T=0;
function play(){
$(B('bk()')+'<div class="center"><div style="font-size:64px;line-height:1.1">'+D[S.cat][0]+'</div><div class="who">Oyun başladı</div><div class="name">Oyuncu '+(S.start+1)+'</div><p class="sub">ilk sen başla. Sırayla kelimeyle ilgili bir ipucu söyleyin, sonra birlikte sahtekârı bulun.</p>'+
(S.min?'<div style="margin-top:22px"><div class="tm" id="tm">'+fm(S.min*60)+'</div><button class="big alt" style="margin-top:6px" onclick="tick()">Süreyi başlat</button></div>':'')+
'<button class="big" onclick="rev()">Sahtekârı göster</button></div>');if(T>Date.now())run()}
function fm(s){return Math.floor(s/60)+':'+('0'+s%60).slice(-2)}
function tick(){
T=Date.now()+S.min*60000;run()}
function run(){clearInterval(S.tid);
S.tid=setInterval(function(){var e=document.getElementById('tm');if(!e)return clearInterval(S.tid);
var r=Math.ceil((T-Date.now())/1000);
if(r<=0){clearInterval(S.tid);e.textContent='Süre doldu';e.className='tm end';buz();setTimeout(buz,300)}else e.textContent=fm(r)},250)}
function bk(){if(confirm('Oyundan çıkılsın mı? Tur kaybolur.')){T=0;setup()}}
function rev(){
$(B('bk()')+'<div class="center"><div class="who">Emin misin?</div><div class="name" style="font-size:34px">Herkes kararını verdi mi?</div><button class="big" onclick="rev2()">Evet, sahtekârı göster</button><button class="big alt" onclick="play()">Hayır, devam</button></div>')}
function rev2(){
var c=S.roles.length?S.roles.map(function(r){return '<span class="chip">Oyuncu '+(r+1)+'</span>'}).join(''):'<div class="name" style="font-size:36px;margin:0">Bu turda sahtekâr yoktu!</div>';
$(B('bk()')+'<div class="center"><div class="who">Sahtekâr</div><div style="margin:10px 0 14px">'+c+'</div>'+
(S.roles.length?'<p class="sub">Yakalandıysa son şansı var: kelimeyi tahmin etsin. Doğru bilirse kazanır.</p>':'')+
'<button class="big" onclick="rev3()">Kelimeyi göster</button></div>')}
function rev3(){
$(B('bk()')+'<div class="center"><div class="card"><div class="k">Kelime ('+S.cat+')</div><div class="w">'+S.word[0]+'</div></div><button class="big" onclick="go()">Yeni tur</button><button class="big alt" onclick="setup()">Ayarlar</button></div>')}

var SB_URL="https://azpiwzrajmuiiznrcnud.supabase.co";   // <-- Supabase Project URL
var SB_KEY="sb_publishable_iPFwpJ50mtvBIakT9rfEeg_I-PN8vr7";   // <-- Supabase Publishable key (sb_publishable_...) ya da eski anon key
var O={sb:null,ch:null,priv:null,id:'',name:'',code:'',admin:false,players:[],role:null,cat:'',starter:'',min:0,end:0,got:{},seen:false,state:'',round:null,pl:{}};
function B(f){return '<button class="back" onclick="'+f+'"><span style="font-size:24px;line-height:1">‹</span> Geri</button>'}

function ct(){return K.map(function(k){return '<button class="cat'+(S.cats[k]?' on':'')+'" style="--c:'+D[k][2].split(',')[0]+'" onclick="tc(\''+k+'\')"><i>'+D[k][0]+'</i>'+k+'</button>'}).join('')}
function home(){S.mode='local';theme();deco('🕵️ 🎭 ❓ 🔍 🎲 🃏');
$('<div class="hm"><div class="logo">🕵️</div><h1 class="ttl">Sahtekâr<em>.</em></h1><p class="tag">Kelimeyi bilmeyeni bul.</p>'+

'<button class="mode b" onclick="omenu()"><i>🌐</i><div><b>Online oda</b><span>Herkes kendi telefonundan kodla katılır</span></div></button>'+
'<div class="how"><div><i>🃏</i>Kartını gör</div><div><i>🤫</i>Sahtekâr bilmez</div><div><i>🗣️</i>Konuş, bul</div></div></div>')}
function sbOk(){if(O.sb)return true;try{if(!SB_URL||!SB_KEY||!window.supabase)return false;O.sb=window.supabase.createClient(SB_URL,SB_KEY);return true}catch(e){return false}}
function rid(){return Math.random().toString(36).slice(2,10)}
function rcode(){var a='ABCDEFGHJKLMNPRSTUVYZ23456789',c='';for(var i=0;i<4;i++)c+=a[Math.floor(Math.random()*a.length)];return c}
function omenu(err){
S.mode='online';theme();var nm='';try{nm=localStorage.getItem('sk_name')||''}catch(e){}
var q=(location.search.match(/oda=([A-Za-z0-9]{4})/)||[])[1]||'';
$(B('home()')+'<h1>Online oda</h1><p class="sub">Kayıt yok. Takma ad yaz, oda kur ya da kodla katıl.</p>'+
(SB_URL?'':'<div class="warn">Online mod için kodun başındaki SB_URL ve SB_KEY doldurulmalı.</div>')+
'<h2>Takma adın</h2><input id="nm" class="inp" maxlength="14" placeholder="Örn. Zeynep" value="'+esc(nm)+'">'+
'<button class="big" onclick="mk()">Oda kur</button><h2>Ya da kodla katıl</h2>'+
'<input id="cd" class="inp code" maxlength="4" placeholder="KOD" autocapitalize="characters" value="'+esc(q.toUpperCase())+'">'+
'<button class="big alt" onclick="jn()">Odaya katıl</button><div class="err">'+(err||'')+'</div>')}
function gn(){var n=document.getElementById('nm').value.trim().slice(0,14);if(!n){omenu('Takma ad yaz.');return null}try{localStorage.setItem('sk_name',n)}catch(e){}return n}
function mk(){var n=gn();if(!n)return;if(!sbOk())return omenu('Online ayarı yapılmamış (SB_URL / SB_KEY).');O.name=n;O.id=rid();O.admin=true;O.code=rcode();conn()}
function jn(){var n=gn();if(!n)return;var c=document.getElementById('cd').value.trim().toUpperCase();if(c.length!=4)return omenu('4 haneli oda kodunu yaz.');if(!sbOk())return omenu('Online ayarı yapılmamış (SB_URL / SB_KEY).');O.name=n;O.id=rid();O.admin=false;O.code=c;conn()}
function conn(){
O.players=[];O.role=null;O.seen=false;O.state='conn';O.end=0;
$(B('lv()')+'<div class="center"><div class="who">Bağlanıyor…</div></div>');
O.ch=O.sb.channel('sk-'+O.code,{config:{presence:{key:O.id},broadcast:{self:false}}});
O.ch.on('presence',{event:'sync'},psync)
.on('broadcast',{event:'start'},function(m){onStart(m.payload)})
.on('broadcast',{event:'timer'},function(m){O.end=Date.now()+m.payload.sec*1000;if(O.state=='play')oplay()})
.on('broadcast',{event:'reveal'},function(m){onReveal(m.payload)})
.on('broadcast',{event:'lobby'},function(){toLobby()})
.on('broadcast',{event:'got'},function(m){O.got[m.payload.id]=1})
.subscribe(function(st){
if(st=='SUBSCRIBED'){
O.ch.track({id:O.id,name:O.name,admin:O.admin});
O.priv=O.sb.channel('sk-'+O.code+'-'+O.id).on('broadcast',{event:'role'},function(m){gotRole(m.payload)}).subscribe();
if(O.admin)toLobby();else O.tm=setTimeout(function(){if(!O.seen){leave(0);omenu('Oda bulunamadı.')}},4500)
}else if(st=='CHANNEL_ERROR'||st=='TIMED_OUT'){leave(0);omenu('Bağlantı kurulamadı. Ayarları ve interneti kontrol et.')}})}
function psync(){
var st=O.ch.presenceState(),a=[];
Object.keys(st).forEach(function(k){var x=st[k][0];if(x)a.push({id:x.id,name:x.name,admin:!!x.admin})});
var had=O.seen,ha=a.some(function(p){return p.admin});O.players=a;if(ha)O.seen=true;
if(!O.admin&&had&&!ha){leave(0);return omenu('Yönetici çıktı, oda kapandı.')}
if(O.state=='conn'&&O.seen){clearTimeout(O.tm);O.state='lobby'}
if(O.state=='lobby')lobby(1)}
function toLobby(){O.state='lobby';O.role=null;O.end=0;clearInterval(S.tid);theme();lobby()}
function lobby(keep){
var ps=O.players.slice().sort(function(a,b){return (b.admin-a.admin)||a.name.localeCompare(b.name)});
var h=B('lv()')+'<div class="split"><div><div class="who">Oda kodu</div><div class="rc" onclick="cp()">'+O.code+'</div><div style="display:flex;gap:8px"><button class="mini" onclick="cp()">Kopyala</button><button class="mini" onclick="sh()">Paylaş</button></div>'+
'<h2>Oyuncular ('+ps.length+')</h2><div>'+ps.map(function(p){return '<span class="chip'+(p.id==O.id?' me':'')+'">'+(p.admin?'👑 ':'')+esc(p.name)+'</span>'}).join('')+'</div>';
if(O.admin)h+='<h2>Ayarlar</h2>'+st('Sahtekâr sayısı','imp','')+st('Tartışma süresi','min','dk')+tg('Sahtekâra ipucu ver','Kategori ve esrarengiz bir ipucu görür','hint')+tg('Sürpriz tur','Bazen hiç sahtekâr olmaz','surp')+
'</div><div>'+catBox()+'</div></div><button class="big go" onclick="ostart()">Oyunu başlat</button>';
else h+='<p class="sub" style="margin-top:22px">Yönetici oyunu başlatınca kartın gelecek.</p></div><div></div></div>';
KEEP=keep?1:0;$(h,1)}
function cp(){try{navigator.clipboard.writeText(O.code)}catch(e){}}
function sh(){var u=location.origin+location.pathname+'?oda='+O.code;try{if(navigator.share){navigator.share({title:'Sahtekâr',text:'Odaya katıl: '+O.code,url:u});return}navigator.clipboard.writeText(u)}catch(e){}}
function ostart(){
var ks=Object.keys(S.cats),ps=O.players.slice();
if(!ks.length){S.err='En az bir kategori seç.';return lobby(1)}
if(ps.length<3){S.err='En az 3 oyuncu gerekli.';return lobby(1)}
S.err='';var pool=[];
ks.forEach(function(k){D[k][1].split('/').forEach(function(e){pool.push([k,e.split('|')[0]])})});
var fr=pool.filter(function(p){return !S.used[p[1]]});if(!fr.length){S.used={};fr=pool}
var p=fr[Math.floor(Math.random()*fr.length)];S.used[p[1]]=1;
var ids=ps.map(function(x){return x.id}).sort(function(){return Math.random()-.5});
var ni=Math.min(S.imp,Math.max(1,Math.floor((ps.length-1)/2)));
var imps=(S.surp&&Math.random()<.2)?[]:ids.slice(0,ni),hint=hintFor(p[0],p[1]);
var starter=ps[Math.floor(Math.random()*ps.length)].name;
O.round={word:p[1],cat:p[0],imps:imps,ps:ps};O.got={};O.pl={};
ps.forEach(function(x){var im=imps.indexOf(x.id)>-1;O.pl[x.id]={imp:im,cat:p[0],word:im?null:p[1],hint:(im&&S.hint)?hint:null}});
var pay={cat:p[0],starter:starter,min:S.min};
O.ch.send({type:'broadcast',event:'start',payload:pay});onStart(pay);sendRoles(0)}
function sendRoles(n){
O.round.ps.forEach(function(x){
if(x.id==O.id){if(!O.role)gotRole(O.pl[x.id]);return}
if(O.got[x.id])return;
var c=O.sb.channel('sk-'+O.code+'-'+x.id);
c.subscribe(function(s){if(s=='SUBSCRIBED'){c.send({type:'broadcast',event:'role',payload:O.pl[x.id]});setTimeout(function(){O.sb.removeChannel(c)},1200)}})});
if(n<3)O.rt=setTimeout(function(){sendRoles(n+1)},2200)}
function onStart(p){
O.cat=p.cat;O.starter=p.starter;O.min=p.min;O.end=0;O.state='wait';theme(p.cat);
if(O.role)opass();else $(B('lv()')+'<div class="center"><div style="font-size:64px">'+D[p.cat][0]+'</div><div class="who">Rolün geliyor…</div></div>')}
function gotRole(pl){O.role=pl;if(!O.admin)O.ch.send({type:'broadcast',event:'got',payload:{id:O.id}});if(O.state=='wait')opass()}
function opass(){O.state='pass';
$(B('lv()')+'<div class="center"><div style="font-size:64px;line-height:1.1">'+D[O.cat][0]+'</div><div class="who">Hazır mısın?</div><div class="name" style="font-size:clamp(30px,10vw,48px)">'+esc(O.name)+'</div><p class="sub">Ekranını kimseye gösterme.</p><button class="big" onclick="oshow()">Kartımı göster</button></div>')}
function oshow(){buz();var r=O.role,h;
if(r.imp)h='<div class="card imp"><div class="k">Senin rolün</div><div class="w">SAHTEKÂR</div><div class="k">Kategori: '+r.cat+'</div>'+(r.hint?'<div class="hint">“'+esc(r.hint)+'”</div>':'')+'</div><p class="sub">Kelimeyi bilmiyorsun. Fark ettirme.</p>';
else h='<div class="card"><div class="k">Kategori: '+r.cat+'</div><div class="w">'+esc(r.word)+'</div><div class="k">'+TH[r.cat][4]+'</div></div><p class="sub">Sahtekâra belli etmeden anlat.</p>';
$(B('lv()')+'<div class="center">'+h+'<button class="big alt" onclick="oplay()">Gizle</button></div>')}
function oplay(){O.state='play';
$(B('lv()')+'<div class="center"><div style="font-size:64px;line-height:1.1">'+D[O.cat][0]+'</div><div class="who">İlk başlayan</div><div class="name" style="font-size:clamp(30px,10vw,52px)">'+esc(O.starter)+'</div><p class="sub">Sırayla kelimeyle ilgili bir şey söyleyin, sonra birlikte sahtekârı bulun.</p>'+
(O.min?'<div style="margin-top:20px"><div class="tm" id="tm">'+fm(O.min*60)+'</div>'+(O.admin?'<button class="big alt" style="margin-top:6px" onclick="otimer()">Süreyi başlat</button>':'')+'</div>':'')+
'<button class="big alt" onclick="oshow()">Kartımı tekrar gör</button>'+(O.admin?'<button class="big" onclick="orev()">Sahtekârı göster</button>':'<p class="sub" style="margin-top:18px">Sahtekârı yönetici açıklayacak.</p>')+'</div>');
if(O.end)runT()}
function otimer(){O.ch.send({type:'broadcast',event:'timer',payload:{sec:O.min*60}});O.end=Date.now()+O.min*60000;runT()}
function runT(){clearInterval(S.tid);S.tid=setInterval(function(){var e=document.getElementById('tm');if(!e)return;var x=Math.ceil((O.end-Date.now())/1000);if(x<=0){clearInterval(S.tid);e.textContent='Süre doldu';e.className='tm end';buz()}else e.textContent=fm(x)},250)}
function orev(){var R=O.round,n=R.ps.filter(function(p){return R.imps.indexOf(p.id)>-1}).map(function(p){return p.name}),pl={imps:n,word:R.word,cat:R.cat};O.ch.send({type:'broadcast',event:'reveal',payload:pl});onReveal(pl)}
function onReveal(p){O.state='reveal';clearInterval(S.tid);
var c=p.imps.length?p.imps.map(function(n){return '<span class="chip">'+esc(n)+'</span>'}).join(''):'<div class="name" style="font-size:34px;margin:0">Bu turda sahtekâr yoktu!</div>';
$(B('lv()')+'<div class="center"><div class="who">Sahtekâr</div><div style="margin:10px 0 14px">'+c+'</div><div class="card"><div class="k">Kelime ('+esc(p.cat)+')</div><div class="w">'+esc(p.word)+'</div></div>'+(O.admin?'<button class="big" onclick="onext()">Yeni tur</button>':'<p class="sub">Yönetici yeni tur başlatacak.</p>')+'</div>')}
function onext(){O.ch.send({type:'broadcast',event:'lobby',payload:{}});toLobby()}
function lv(){if(O.state&&O.state!='lobby'&&O.state!='conn'&&!confirm('Odadan çıkılsın mı?'))return;leave()}
function leave(go){
clearTimeout(O.tm);clearTimeout(O.rt);clearInterval(S.tid);
try{if(O.ch)O.sb.removeChannel(O.ch);if(O.priv)O.sb.removeChannel(O.priv)}catch(e){}
O.ch=O.priv=null;O.state='';O.role=null;O.end=0;O.admin=false;S.mode='local';theme();if(go!==0)home()}
/oda=/.test(location.search)?omenu():home();
</script>
